<div class="roster-filters" data-roster-filters>
  <span class="roster-filters__label">Filter</span>
  <button type="button" class="roster-filters__chip" data-roster-filter="aa-filed" aria-pressed="false">
    Task completers (filed AA)
  </button>
  <button type="button" class="roster-filters__chip" data-roster-filter="job-coding" aria-pressed="false">
    Code fixers (coding job)
  </button>
  <button type="button" class="roster-filters__chip roster-filters__chip--disabled" disabled title="No filed roster leaf yet">
    Prose writers (no filed score)
  </button>
  <button type="button" class="roster-filters__chip roster-filters__chip--disabled" disabled title="No filed roster leaf yet">
    Instruction followers (no filed score)
  </button>
</div>
<script src="{{ "js/roster-filters.js" | relURL }}" defer></script>
