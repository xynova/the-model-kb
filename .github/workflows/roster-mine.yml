name: roster-mine

on:
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: roster-mine
  cancel-in-progress: false

jobs:
  mine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: tools/roster-mill/go.mod
          cache-dependency-path: tools/roster-mill/go.sum

      - name: Install Fusion dbt
        run: |
          curl -fsSL https://public.cdn.getdbt.com/fs/install/install.sh | sh -s -- --update --yes
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Mine hosts
        env:
          AA_API_KEY: ${{ secrets.AA_API_KEY }}
        run: make -C site mine-hosts

      - name: Build dbt scores
        run: make -C dbt build

      - name: Stage roster outputs
        run: git add roster site/static/roster.json

      - name: Skip when no diff
        id: diff
        run: |
          if git diff --cached --quiet; then
            echo "no mine diff"
            exit 0
          fi
          echo "has_diff=true" >> "$GITHUB_OUTPUT"

      - name: Commit mine
        if: steps.diff.outputs.has_diff == 'true'
        run: git commit -m "Roster mine"

      - name: Push roster-mine branch
        if: steps.diff.outputs.has_diff == 'true'
        run: git push --force-with-lease origin HEAD:roster-mine

      - name: Open or update PR
        if: steps.diff.outputs.has_diff == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          body="$(mktemp)"
          go run ./tools/roster-mill/cmd/roster-mill review-body > "$body"
          num="$(gh pr list --head roster-mine --state open --json number -q '.[0].number' || true)"
          if [ -z "$num" ] || [ "$num" = "null" ]; then
            gh pr create --base main --head roster-mine --title "Roster mine" --body-file "$body"
          else
            gh pr edit "$num" --body-file "$body"
          fi
