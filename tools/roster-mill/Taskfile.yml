version: "3"

tasks:
  default:
    desc: List tasks
    silent: true
    cmds:
      - task --list

  format:
    desc: Format Go sources
    cmds:
      - gofmt -w ./cmd ./internal

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  test:
    desc: Run unit tests
    cmds:
      - go test ./...

  build:
    desc: Build bin/roster-mill
    cmds:
      - mkdir -p bin
      - go build -o bin/roster-mill ./cmd/roster-mill
