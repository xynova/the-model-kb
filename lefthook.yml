# Git hooks live in this repo. Cursor skills and rules come from the cursor-packs plugin.
pre-commit:
  parallel: false
  commands:
    default-branch-refuse:
      run: bash scripts/git-hooks/default-branch-refuse.sh
    go-format:
      glob: "*.go"
      run: bash scripts/git-hooks/go-format-staged.sh {staged_files}
      stage_fixed: true
